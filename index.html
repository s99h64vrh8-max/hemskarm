<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#071d24">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Jarvis – hemskärm 3.0</title>
<style>
/* Jarvis hemskärm 3.0 – en fil, ingen byggprocess. Mål: iPad Air 2 / Safari 15.
   Regel: ljus text på mörka ytor, mörk text bara på ljusa ytor (knappar, lappar, fält, dialoger). */
:root{
  --c1:#071d24;--c2:#0b3340;--c3:#0f4a52;
  --card:8,32,40; --accent:#ffcf3f; --accentInk:#111111;
  --ink:#ffffff; --ink2:rgba(255,255,255,.86); --ink3:rgba(255,255,255,.72);
  --line:rgba(255,255,255,.12); --soft:rgba(255,255,255,.07); --r:24px; --vh:7.68px; --rail:96px;
  --ease:cubic-bezier(.2,.8,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--c1);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0;margin:0}
input,textarea,select{font:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
ul{list-style:none;margin:0;padding:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Bakgrund & ambient ---------- */
#bg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:0;overflow:hidden;
  background:linear-gradient(160deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);transition:background 1s}
.blob{position:absolute;width:90vmax;height:90vmax;border-radius:50%;opacity:.55;will-change:transform}
#b1{left:-30vmax;top:-40vmax;animation:drift1 46s ease-in-out infinite alternate}
#b2{right:-35vmax;top:-10vmax;animation:drift2 58s ease-in-out infinite alternate}
#b3{left:10vmax;bottom:-55vmax;animation:drift3 64s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate3d(0,0,0)}to{transform:translate3d(14vmax,10vmax,0)}}
@keyframes drift2{from{transform:translate3d(0,0,0)}to{transform:translate3d(-12vmax,14vmax,0)}}
@keyframes drift3{from{transform:translate3d(0,0,0)}to{transform:translate3d(10vmax,-12vmax,0)}}
body.noanim .blob,body.noanim #fx *{animation:none !important}
body.noanim #fx{display:none}
#fx{position:fixed;left:0;top:0;right:0;bottom:0;z-index:1;pointer-events:none;overflow:hidden}
#fx .p{position:absolute;top:-40px;animation:fall linear infinite;will-change:transform}
#fx .up{top:auto;bottom:-40px;animation-name:rise}
@keyframes fall{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(40px,calc(var(--vh) * 100 + 80px),0) rotate(260deg)}}
@keyframes rise{from{transform:translate3d(0,0,0) scale(1);opacity:.0}10%{opacity:.8}to{transform:translate3d(-30px,calc(var(--vh) * -100 - 80px),0) scale(.6);opacity:0}}
#fx .tw{position:absolute;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
#fx .fw{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;animation:burst 4.2s ease-out infinite;opacity:0}
@keyframes burst{0%{transform:scale(.1);opacity:0}8%{opacity:.75}60%{opacity:.45}100%{transform:scale(1.4);opacity:0}}
#garland{position:fixed;left:var(--rail);right:0;top:0;height:34px;z-index:2;pointer-events:none}
#garland svg{width:100%;height:34px}
.blink{animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
body.noanim .blink{animation:none}

/* ---------- Ram ---------- */
#rail{position:fixed;z-index:20;left:0;top:0;bottom:0;width:var(--rail);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 9px 10px;background:rgba(3,8,12,.78);border-right:1px solid var(--line)}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;color:var(--ink2);min-height:50px;margin:2px 0;transition:background .25s,color .25s}
.tab svg{width:28px;height:28px}
.tab span{font-size:13px;font-weight:600;margin-top:3px;letter-spacing:.2px}
.tab.on{background:var(--accent);color:var(--accentInk)}
.tab.add{flex:0 0 58px;background:rgba(255,255,255,.12);color:var(--ink);border:1px solid rgba(255,255,255,.22);margin-bottom:8px}
.tab.add svg{width:30px;height:30px}
.tab .bdg{font-style:normal;position:absolute;margin:-30px 0 0 34px;min-width:20px;height:20px;border-radius:10px;background:#ffd0d0;color:#111;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.tab{position:relative}
#fab{display:none}
#main{position:fixed;z-index:5;left:var(--rail);top:0;right:0;height:calc(var(--vh) * 100);padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 16px}
.view{display:none;height:100%;min-height:0}
.view.on{display:flex;flex-direction:column;animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.view.on .card{animation:cardIn .5s var(--ease) both}
.view.on .card:nth-child(2){animation-delay:.04s}.view.on .card:nth-child(3){animation-delay:.08s}.view.on .card:nth-child(4){animation-delay:.12s}.view.on .card:nth-child(5){animation-delay:.16s}.view.on .card:nth-child(n+6){animation-delay:.2s}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,14px,0) scale(.985)}to{opacity:1;transform:none}}
body.noanim .view.on,body.noanim .view.on .card,body.noanim .li.new,body.noanim .sheet,body.noanim .ov.open{animation:none !important}
@media (prefers-reduced-motion:reduce){.view.on,.view.on .card,.li.new,.sheet,.blob,#fx *{animation:none !important}}

/* ---------- Kort ---------- */
.card{position:relative;border-radius:var(--r);background:linear-gradient(180deg,rgba(var(--card),.95),rgba(var(--card),.92));
  border:1px solid var(--line);box-shadow:0 16px 36px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
body.glass .card{background:linear-gradient(180deg,rgba(var(--card),.62),rgba(var(--card),.55));-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.ch{display:flex;align-items:center;padding:14px 14px 10px 16px;flex:0 0 auto}
.ch h3{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;flex:1 1 auto;display:flex;align-items:center;min-width:0}
.ch h3 > svg{width:34px;height:34px;padding:7px;border-radius:11px;margin-right:10px;color:var(--accentInk);background:var(--accent);flex:0 0 auto}
.ch h3 .cnt{font-size:15px;font-weight:600;color:var(--ink3);margin-left:8px;white-space:nowrap}
.ch h3 .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ch > * + *{margin-left:8px}
.cb{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 12px;min-height:0}
.more{font-size:15px;font-weight:600;color:var(--ink2);display:flex;align-items:center;min-height:44px;padding:0 6px 0 12px;white-space:nowrap}
.more svg{width:18px;height:18px;margin-left:2px}
.ibtn{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accentInk);flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s}
.ibtn:active,.pbtn:active,.gbtn:active,.tab:active{transform:scale(.95)}
.ibtn svg{width:26px;height:26px}
.ibtn.ghost{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.pbtn{min-height:48px;border-radius:15px;padding:0 18px;background:var(--accent);color:var(--accentInk);font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:transform .15s}
.pbtn svg{width:20px;height:20px;margin-right:7px}
.gbtn{min-height:48px;border-radius:15px;padding:0 16px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:transform .15s}
.gbtn svg{width:20px;height:20px;margin-right:7px}
.gbtn.sm,.pbtn.sm{min-height:44px;font-size:15px;padding:0 12px;border-radius:12px}
.empty{color:var(--ink2);font-size:17px;font-style:italic;padding:14px 8px;line-height:1.4;text-align:left}
.vh{display:flex;align-items:flex-end;margin-bottom:14px;flex:0 0 auto}
.vh h1{margin:0;font-size:40px;font-weight:300;letter-spacing:-.5px;line-height:1}
.vh .sub{font-size:17px;color:var(--ink2);margin-top:6px;font-style:italic}
.vh .tt{flex:1 1 auto;min-width:0}
.vh .act{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.vh .act > *{margin-left:10px}
.vh{text-shadow:0 0 3px rgba(0,0,0,.5),0 0 14px rgba(0,0,0,.5)}
.vh .act{text-shadow:none}
/* segmenterad flik på mörk yta */
.seg2{display:inline-flex;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg2 button{min-height:44px;padding:0 16px;border-radius:12px;font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center}
.seg2 button svg{width:20px;height:20px;margin-right:6px}
.seg2 button.on{background:var(--accent);color:var(--accentInk)}

/* ---------- Listor ---------- */
.li{display:flex;align-items:center;min-height:56px;padding:4px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.new,.new{animation:itemIn .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes itemIn{from{opacity:0;transform:translate3d(-14px,0,0) scale(.97)}to{opacity:1;transform:none}}
.ck{flex:0 0 48px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin-right:8px}
.ck i{width:32px;height:32px;border-radius:11px;border:2.5px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .2s}
.ck svg{width:22px;height:22px;color:var(--accentInk)}
.ck svg path{stroke-dasharray:24;stroke-dashoffset:24}
.done .ck i{background:var(--accent);border-color:var(--accent)}
.done .ck svg path{stroke-dashoffset:0}
.pop .ck i{animation:pop .42s cubic-bezier(.2,.9,.3,1.4)}
.pop .ck svg path{transition:stroke-dashoffset .35s ease-out .08s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.lt{flex:1 1 auto;min-width:0;text-align:left;font-size:20px;line-height:1.25;padding:8px 0;color:var(--ink);word-wrap:break-word}
.lt small{display:block;font-size:14px;color:var(--ink3);margin-top:2px}
.done .lt{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.45)}
.who{flex:0 0 auto;font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;margin-left:8px;color:#111;white-space:nowrap}
.who-me{background:#a9d8ff}.who-partner{background:#ffc6de}.who-both{background:#dccbff}
.ex{display:inline-block;white-space:nowrap;font-size:12px;font-weight:800;color:#111;background:#e9ecef;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;line-height:1.35;font-style:normal;text-decoration:none;letter-spacing:.3px}
.ev{display:flex;align-items:center;width:100%;text-align:left;border-radius:14px;padding:8px 12px;margin:5px 0;font-size:18px;color:var(--ink);min-height:48px;background:var(--soft);border:1px solid var(--line)}
.ev .tm{font-weight:700;margin-right:10px;color:var(--accent);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ev .tm svg{width:22px;height:22px}
.ev .et{flex:1 1 auto;min-width:0;line-height:1.25}
.ev .rp{display:inline-block;font-size:13px;color:var(--ink3);margin-left:6px;white-space:nowrap}
.sec{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);margin:12px 6px 4px}
.tag{display:inline-flex;align-items:center;white-space:nowrap;font-size:13px;font-weight:800;color:#111;border-radius:999px;padding:3px 10px;line-height:1.3;font-style:normal}
.t-red{background:#ffc9c9}.t-yel{background:#ffe48a}.t-grn{background:#c6f0bd}.t-blu{background:#bfe3ff}.t-gry{background:#e6e9eb}.t-pur{background:#dccbff}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}

/* ---------- Hem ---------- */
#v-home{display:none}
#v-home.on{display:grid}
#v-home{grid-template-columns:repeat(12,1fr);grid-template-rows:214px 100px minmax(0,1fr);gap:14px;
  grid-template-areas:"clk clk clk clk clk wx wx wx wx wx wx wx" "nx nx nx nx nx nx nx ml ml ml ml ml" "td td td td jv jv jv jv sh sh sh sh"}
#hClock{grid-area:clk;display:flex;flex-direction:column;justify-content:flex-start;padding:2px 4px 0;text-shadow:0 0 3px rgba(0,0,0,.55),0 0 14px rgba(0,0,0,.55),0 2px 22px rgba(0,0,0,.5);min-width:0}
.bigtime{font-size:100px;font-weight:200;letter-spacing:-4px;line-height:.92;font-variant-numeric:tabular-nums}
.bigtime .sec2{font-size:.3em;font-weight:300;letter-spacing:0;color:var(--ink2);margin-left:6px}
.dateline{font-size:22px;font-weight:600;margin-top:8px}
.dateline span{color:var(--ink2);font-weight:500}
.calline{display:flex;flex-wrap:nowrap;overflow:hidden;margin-top:7px;text-shadow:none;min-width:0}
.dchip{display:inline-flex;align-items:center;min-height:30px;border-radius:999px;padding:0 12px 0 9px;margin:0 6px 6px 0;font-size:15px;font-weight:600;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.2);color:#fff;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.dchip svg{width:16px;height:16px;margin-right:6px;flex:0 0 auto}
.dchip.red{background:#ffc9c9;color:#111;border-color:transparent}
.dchip.flag{background:#bfe3ff;color:#111;border-color:transparent}
#greet{font-size:22px;font-weight:600;margin-top:4px;line-height:1.2}
#hWx{grid-area:wx}
#hNext{grid-area:nx}
#hMeal{grid-area:ml;flex-direction:row;align-items:center;padding:0 14px 0 18px}
#hToday{grid-area:td}#hJarvis{grid-area:jv}#hShop{grid-area:sh}
.nextc{flex-direction:row;align-items:center;padding:0 20px;text-align:left;background:linear-gradient(110deg,rgba(var(--card),.92),rgba(var(--card),.8))}
.nextc .ic{width:54px;height:54px;border-radius:17px;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-right:16px}
.nextc .ic svg{width:30px;height:30px}
.lbl{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3)}
.nextc .tx{font-size:23px;font-weight:600;line-height:1.2;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.nextc .tt{flex:1 1 auto;min-width:0}
.nextc .when{flex:0 0 auto;text-align:right;margin-left:12px}
.nextc .when b{display:block;font-size:30px;font-weight:300;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.05}
.nextc .when span{font-size:14px;color:var(--ink2)}
.mealc .tt{flex:1 1 auto;min-width:0;text-align:left}
.mealc .dish{font-size:23px;font-weight:400;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mealc .dish.none{font-style:italic;color:var(--ink2);font-size:18px;white-space:normal}
.mealc .ibtn{margin-left:10px}
/* Dagens Jarvis */
.jv .sum{font-size:17px;line-height:1.35;padding:0 16px 4px;color:var(--ink)}
.jv .quip{font-size:16px;line-height:1.35;padding:2px 16px 8px;color:var(--ink2);font-style:italic}
.kr{display:flex;align-items:center;width:100%;min-height:46px;padding:5px 4px;border-top:1px solid var(--line);text-align:left;font-size:16px;color:var(--ink)}
.kr i{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-right:10px;flex:0 0 auto;background:var(--accent);color:var(--accentInk);font-style:normal;font-size:16px}
.kr i svg{width:19px;height:19px}
.kr span{flex:1 1 auto;min-width:0;line-height:1.25}
.kr b.r{flex:0 0 auto;margin-left:8px;font-size:14px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.kr.hot i{background:#ffc9c9}
.mini{display:flex;align-items:center;min-height:44px;border-top:1px solid var(--line);padding:4px 6px;font-size:17px;width:100%;text-align:left}
.mini .d{flex:0 0 40px;color:var(--ink3);font-weight:700;font-size:15px}
.mini .d svg{width:22px;height:22px;color:var(--accent)}
.mini .t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Väder ---------- */
.wx{flex-direction:row;padding:14px 14px 12px 16px}
.wxnow{flex:0 0 200px;display:flex;flex-direction:column;min-width:0}
.wxtop{display:flex;align-items:center}
.wxtop svg{width:68px;height:68px;flex:0 0 auto}
.wxt{font-size:58px;font-weight:200;letter-spacing:-2px;line-height:1;margin-left:6px;font-variant-numeric:tabular-nums}
.wxd{font-size:17px;font-weight:600;margin-top:6px}
.wxs{font-size:15px;color:var(--ink2);margin-top:3px}
.wxs b{color:var(--ink)}
.wxplace{font-size:13px;color:var(--ink3);margin-top:auto;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxplace svg{width:14px;height:14px;margin-right:4px;flex:0 0 auto}
.wxr{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:12px;margin-left:8px}
.wxrow{display:flex;flex:1 1 0;min-height:0}
.wxrow + .wxrow{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.wxc{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.wxc .h{font-size:14px;color:var(--ink2);font-weight:600}
.wxc svg{width:34px;height:34px;margin:2px 0}
.wxc .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.wxc .v span{color:var(--ink3);font-weight:500}
.wxempty{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 8px}
.wxempty p{margin:0 0 12px;font-size:18px;color:var(--ink2);font-style:italic;line-height:1.35}
.offl{display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:#111;background:#ffd27a;border-radius:6px;padding:1px 6px;margin-left:6px}

/* ---------- Vecka ---------- */
.weekgrid{flex:1 1 auto;display:flex;min-height:0}
.wday{flex:1 1 0;min-width:0;margin-right:10px;display:flex;flex-direction:column}
.wday:last-child{margin-right:0}
.wday .wh{padding:11px 10px 8px;border-bottom:1px solid var(--line)}
.wday .wn{font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink2)}
.wday .wd{font-size:32px;font-weight:200;line-height:1.05;font-variant-numeric:tabular-nums}
.wday .wnd{font-size:13px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wday .hol{display:block;margin-top:5px;font-size:12px;font-weight:800;color:#111;background:#ffc9c9;border-radius:7px;padding:2px 6px;line-height:1.25}
.wday .hol.fl{background:#bfe3ff}.wday .hol.inf{background:#e6e9eb}
.wday.today{background:linear-gradient(180deg,rgba(var(--card),.97),rgba(var(--card),.9));border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 16px 36px rgba(0,0,0,.3)}
.wday.today .wn{color:var(--accent)}
.wday.redday .wd{color:#ffc9c9}

function wxKind(c){c=+c;if(c===0)return 'clear';if(c===1||c===2)return 'partly';if(c===3)return 'cloudy';if(c===45||c===48)return 'fog';if(c>=51&&c<=57)return 'drizzle';if((c>=61&&c<=67)||(c>=80&&c<=82))return 'rain';if((c>=71&&c<=77)||c===85||c===86)return 'snow';if(c>=95)return 'thunder';return 'cloudy';}

function wxSvg(code,isDay){
  var k=wxKind(code),o='<svg viewBox="0 0 64 64" aria-hidden="true">';
  var sun=function(cx,cy,r){var s='<g stroke="#ffd23f" stroke-width="3" stroke-linecap="round">';for(var i=0;i<8;i++){var a=i*Math.PI/4,x1=cx+Math.cos(a)*(r+5),y1=cy+Math.sin(a)*(r+5),x2=cx+Math.cos(a)*(r+10),y2=cy+Math.sin(a)*(r+10);s+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>';}return s+'</g><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#ffd23f"/>';};
  var moon=function(cx,cy,r){return '<path d="M'+(cx+r*0.3)+' '+(cy-r)+'a'+r+' '+r+' 0 1 0 '+(r*0.75)+' '+(r*1.55)+'A'+(r*0.85)+' '+(r*0.85)+' 0 0 1 '+(cx+r*0.3)+' '+(cy-r)+'z" fill="#f3e6a8"/>';};
  var cloud=function(dx,dy,fill){return '<path transform="translate('+dx+' '+dy+')" d="M18 50h28a10 10 0 0 0 1-20 14 14 0 0 0-27-2 11 11 0 0 0-2 22z" fill="'+(fill||'#eef3f7')+'"/>';};
  if(k==='clear')o+=isDay?sun(32,32,12):moon(30,32,16);
  else if(k==='partly')o+=(isDay?sun(24,22,9):moon(22,22,11))+cloud(4,4);
  else if(k==='cloudy')o+=cloud(-4,-8,'#b9c6d0')+cloud(2,2);
  else if(k==='fog')o+=cloud(0,-6,'#c9d3da')+'<g stroke="#e3e9ee" stroke-width="3.5" stroke-linecap="round"><line x1="12" y1="52" x2="52" y2="52"/><line x1="18" y1="59" x2="46" y2="59"/></g>';
  else{
    o+=cloud(0,-8,k==='thunder'?'#aeb9c4':'#dfe7ee');
    if(k==='rain'||k==='drizzle'){var n=k==='rain'?3:2;o+='<g stroke="#7cc4ff" stroke-width="3.5" stroke-linecap="round">';for(var i=0;i<n;i++){var x=22+i*10;o+='<line x1="'+x+'" y1="48" x2="'+(x-4)+'" y2="58"/>';}o+='</g>';}
    if(k==='snow'){o+='<g fill="#ffffff">';[[22,52],[32,57],[42,52],[27,61],[37,62]].forEach(function(p){o+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.8"/>';});o+='</g>';}
    if(k==='thunder')o+='<path d="M34 40l-8 13h7l-3 10 10-15h-7l4-8z" fill="#ffd23f"/>';
  }
  return o+'</svg>';
}

function autoTheme(d){
  var y=d.getFullYear(),md=(d.getMonth()+1)*100+d.getDate();
  if(md>=1227||md<=102)return 'nyar';
  if(d>=forstaAdvent(y)&&md<=1226)return 'jul';
  if(md>=210&&md<=214)return 'hjartans';
  var e=easter(y); if(between(d,addDays(e,-7),addDays(e,1)))return 'pask';
  if(md>=427&&md<=501)return 'valborg';
  var ms=midsommarafton(y); if(between(d,addDays(ms,-6),addDays(ms,2)))return 'midsommar';
  if(md>=701&&md<=815)return 'sommar';
  if(md>=1025&&md<=1101)return 'halloween';
  if(md>=901)return 'host';
  if(md>=103&&md<=315)return 'vinter';
  return 'standard';
}

function guessCat(text){
  var t=' '+String(text||'').toLowerCase().replace(/[0-9]+\s*(st|kg|g|hg|l|dl|ml|paket|pkt|burk|burkar|förp)?\.?/g,' ').replace(/[^a-zåäöéü ]/g,' ')+' ';
  for(var i=0;i<CATIDX.length;i++){var w=CATIDX[i][0];
    if(t.indexOf(' '+w+' ')>=0||t.indexOf(' '+w)>=0&&w.length>=4)return CATIDX[i][1];
    // sammansatta ord: "kycklingfilé" slutar på/innehåller
    var words=t.trim().split(/\s+/);for(var j=0;j<words.length;j++){if(w.length>=4&&words[j].length>w.length&&(words[j].slice(-w.length)===w))return CATIDX[i][1];}
  }
  return 'ovrigt';
}

/* Läser v1-, v2- och v3-data. Inget i äldre data kastas – nya fält läggs till. */
function normalize(o){
  var d=defaults();if(!o||typeof o!=='object')return d;
  var ver=+o.v||1;
  var s=o.settings&&typeof o.settings==='object'?o.settings:{};for(var k in d.settings){if(!(k in s))s[k]=d.settings[k];}
  if(!s.cd||typeof s.cd!=='object')s.cd=d.settings.cd;
  var r={v:APPV,settings:s};
  LISTS_V2.forEach(function(k){r[k]=Array.isArray(o[k])?o[k]:(ver>=2?[]:d[k]);});
  if(ver<2){r.chores=[];r.pickups=[];r.dates=[];r.timers=[];r.favs=d.favs;} // från v1: inga nya exempel
  r.events.forEach(function(e){if(!e.repeat)e.repeat=e.weekly?'weekly':'none';delete e.weekly;});
  r.shop.forEach(function(x){if(!x.cat)x.cat=guessCat(x.text);});
  r.chores.forEach(function(c){if(!(c.pts>=1))c.pts=1;});
  r.notes.forEach(function(n){if(!n.ts)n.ts=0;});
  r.menu=o.menu&&typeof o.menu==='object'?o.menu:{};for(var i=1;i<=7;i++)if(!r.menu[i])r.menu[i]={dish:'',ingr:[]};
  r.dagens=o.dagens||null;r.lastDay=o.lastDay||ymd(now());
  // v3-fält
  if(ver<3){var x=v3Examples();r.bills=x.bills;r.service=x.service;r.parcels=[];r.fridge=[];r.jarvis=[];r.recipes=starterRecipes();r.evening=defaultEvening();r.migrated={from:ver,at:ymd(now())};}
  else{LISTS_V3.forEach(function(k){r[k]=Array.isArray(o[k])?o[k]:[];});r.migrated=o.migrated||null;}
  r.bills.forEach(function(b){if(!b.paid||typeof b.paid!=='object')b.paid={};b.amount=+b.amount||0;b.day=Math.max(1,Math.min(31,+b.day||1));b.every=+b.every||1;});
  r.choreHist=o.choreHist&&typeof o.choreHist==='object'?o.choreHist:{};
  r.fridgeStats=o.fridgeStats&&typeof o.fridgeStats==='object'?o.fridgeStats:{};
  // v4: hushållets personer. Gamla me/partner blir personer med samma id – inget i listorna behöver skrivas om.
  r.people=normPeople(o.people,s);
  if(ver<4)r.peopleMigrated={from:ver,at:ymd(now())};else r.peopleMigrated=o.peopleMigrated||null;
  r.chores.forEach(function(c){if(c.mode==='rotate'&&!Array.isArray(c.rot)){c.rot=['me','partner'];c.sw=0;c.start=c.start==='partner'?'partner':'me';}});
  return r;
}

  var seen={},out=[];
  (Array.isArray(a)?a:[]).forEach(function(p,i){if(!p||typeof p!=='object')return;var id=String(p.id||'');if(!id||seen[id]||id==='both')return;seen[id]=1;

function fieldHtml(f,v){

  return h;

function collectForm(){
  var out={};

function personRefs(id){var n=0;PEOPLE_KEYS.forEach(function(k){S[k].forEach(function(x){if(x.who===id)n++;});});
  S.chores.forEach(function(c){if(c.mode===id||(c.mode==='rotate'&&rotOf(c).indexOf(id)>=0))n++;});return n;}
function reassignPerson(from,to){
  PEOPLE_KEYS.forEach(function(k){S[k].forEach(function(x){if(x.who===from)x.who=to;});});
  S.chores.forEach(function(c){
    if(c.doneBy===from)c.doneBy=to;
    if(c.mode===from)c.mode=to;
    else if(c.mode==='rotate'){var cur=choreWho(c),rot=rotOf(c).filter(function(x){return x!==from;});
      if(!rot.length){c.mode=to;delete c.rot;return;}
      // behåll den som har sysslan den här veckan
      c.rot=rot;c.start=cur!==from&&rot.indexOf(cur)>=0?cur:(to!=='both'&&rot.indexOf(to)>=0?to:rot[0]);c.sw=weekIndex(now());}});
}
function removePerson(id,to){
  if(people().length<=1)return false;
  if(to!=='both'&&(!person(to)||to===id))to='both';
  reassignPerson(id,to);
  S.people=people().filter(function(p){return p.id!==id;});
  if(DEV.who===id){DEV.who='';saveDev();}
  syncNames();return true;
}

}
function beep(){

  try{if(actx.state==='suspended'&&actx.resume)actx.resume();
    var t0=actx.currentTime;[0,0.22,0.44].forEach(function(dt,i){var o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i===2?1175:880;

      o.connect(g);g.connect(actx.destination);o.start(t0+dt);o.stop(t0+dt+0.2);});}catch(e){}
}

  $('alarm').className='open flash';closeSaver();
  if(!alarmT){alarmStart=Date.now();beep();alarmT=setInterval(function(){if(Date.now()-alarmStart<180000)beep();},1400);}
  if(navigator.vibrate)try{navigator.vibrate([400,200,400]);}catch(e){}
}
function stopAlarm(){
  clearInterval(alarmT);alarmT=null;$('alarm').className='';
  S.timers=S.timers.filter(function(t){return t.state!=='ring';});save();renderAll();
}
function startTimer(min,name){
  var ms=Math.round(min*60000);if(!(ms>0))return;
  var t={id:uid(),name:name||'Timer',dur:ms,end:Date.now()+ms,left:ms,state:'run'};S.timers.push(t);save();
  toast(t.name+': '+min+' min. Jag håller koll.');renderAll();
}
function tickTimers(){
  var ringing=false;
  S.timers.forEach(function(t){if(t.state==='run'&&Date.now()>=t.end){t.state='ring';ringing=true;save();startAlarm(t);if(cur==='timer')renderTimer();}});
  [].forEach.call(document.querySelectorAll('[data-tleft]'),function(el){var t=byId(S.timers,el.getAttribute('data-tleft'));if(t)el.textContent=t.state==='ring'?'00:00':fmtDur(timerLeft(t));});
  [].forEach.call(document.querySelectorAll('[data-tarc]'),function(el){var t=byId(S.timers,el.getAttribute('data-tarc'));if(t){var f=t.dur?Math.max(0,Math.min(1,timerLeft(t)/t.dur)):0;el.setAttribute('stroke-dashoffset',(RING_C*(1-f)).toFixed(1));}});
}

function doExport(){
  var name='jarvis-hemskarm-'+ymd(now())+'.json';
  try{var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);toast('Säkerhetskopia skapad: '+name);}
  catch(e){toast('Nedladdning gick inte – använd Visa som text.');}

function importData(txt){
  var o;try{o=JSON.parse(txt);}catch(e){toast('Det där var inte en giltig säkerhetskopia.');return;}
  if(!o||!o.settings||!o.todos){toast('Filen saknar hemskärmsdata.');return;}
  if(!confirm('Ersätta allt på skärmen med säkerhetskopian?'))return;
  S=normalize(o);save();applyTheme(true);renderAll();toast('Säkerhetskopian är inläst. Välkommen tillbaka.');
}

/* ================= Tick & dygn ================= */
var lastMin=-1,lastDay='';
function applyNight(){var h=now().getHours();document.body.classList.toggle('isnight',!!S.settings.night&&(h>=23||h<6));}
function dayRollover(){
  var today=ymd(now());if(S.lastDay===today)return;
  recordWeek(S.lastDay);
  if(S.settings.autoClear)S.todos=S.todos.filter(function(t){return !t.done;});
  var pc=ymd(addDays(now(),-3));S.parcels=S.parcels.filter(function(p){return p.status!=='klar'||(p.doneAt||today)>pc;});
  var cutoff=ymd(addDays(now(),-60));S.events=S.events.filter(function(e){return (e.repeat&&e.repeat!=='none')||e.date>=cutoff;});
  S.lastDay=today;save();
}
function tick(){
  var d=now();
  if(cur==='home'&&S.settings.secs)renderClock();
  tickTimers();checkIdle();
  if(d.getMinutes()!==lastMin){
    lastMin=d.getMinutes();
    if(ymd(d)!==lastDay){lastDay=ymd(d);dayRollover();applyTheme();renderAll();}
    else if(cur==='home')renderHome();else{renderClock();if(cur==='kvall')renderKvall();}
    if($('saver').className.indexOf('open')>=0){renderSaver();if(++saverDrift%2===0){var sv=$('saverIn');sv.style.marginLeft=Math.round(rnd(-60,60))+'px';sv.style.marginTop=Math.round(rnd(-40,40))+'px';}}
    applyNight();
  }
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){lastMin=-1;lastDay='';tick();refreshWx();fetchDagens();}});
window.addEventListener('resize',function(){setVh();applyLayout();});
window.addEventListener('orientationchange',function(){setTimeout(setVh,300);});

/* ================= Daglig Jarvis-fil (dagens.json) ================= */
function fetchDagens(){
  if(!window.fetch||location.protocol==='file:')return;
  fetch('dagens.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(!j)return;
    if(j.meddelande)S.dagens={date:j.datum||ymd(now()),text:String(j.meddelande)};
    if(j.handelser&&j.handelser.length)j.handelser.forEach(function(e){var id='j-'+(e.id||(e.datum+'-'+e.text));if(findIn(S.events,id)<0)S.events.push({id:id,date:e.datum,time:e.tid||'',text:e.text,who:e.vem||'',repeat:'none'});});
    if(j.inkop&&j.inkop.length)addShop(j.inkop);
    save();renderAll();
  }).catch(function(){});
}

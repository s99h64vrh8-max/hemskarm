<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#071d24">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Jarvis – hemskärm</title>
<style>
:root{
  --c1:#071d24;--c2:#0b3340;--c3:#0f4a52;
  --card:8,32,40; --accent:#ffcf3f; --accent2:#7fe0d0; --accentInk:#111111;
  --ink:#ffffff; --ink2:rgba(255,255,255,.82); --ink3:rgba(255,255,255,.66);
  --line:rgba(255,255,255,.13); --r:22px; --vh:7.68px; --rail:92px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--c1);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0;margin:0}
input,textarea,select{font:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
ul{list-style:none;margin:0;padding:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Bakgrund & ambient ---------- */
#bg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:0;overflow:hidden;
  background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);transition:background 1s}
.blob{position:absolute;width:90vmax;height:90vmax;border-radius:50%;opacity:.55;will-change:transform}
#b1{left:-30vmax;top:-40vmax;animation:drift1 46s ease-in-out infinite alternate}
#b2{right:-35vmax;top:-10vmax;animation:drift2 58s ease-in-out infinite alternate}
#b3{left:10vmax;bottom:-55vmax;animation:drift3 64s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate3d(0,0,0)}to{transform:translate3d(14vmax,10vmax,0)}}
@keyframes drift2{from{transform:translate3d(0,0,0)}to{transform:translate3d(-12vmax,14vmax,0)}}
@keyframes drift3{from{transform:translate3d(0,0,0)}to{transform:translate3d(10vmax,-12vmax,0)}}
body.noanim .blob,body.noanim #fx *{animation:none !important}
body.noanim #fx{display:none}
#fx{position:fixed;left:0;top:0;right:0;bottom:0;z-index:1;pointer-events:none;overflow:hidden}
#fx .p{position:absolute;top:-40px;animation:fall linear infinite;will-change:transform}
#fx .up{top:auto;bottom:-40px;animation-name:rise}
@keyframes fall{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(40px,calc(var(--vh) * 100 + 80px),0) rotate(260deg)}}
@keyframes rise{from{transform:translate3d(0,0,0) scale(1);opacity:.0}10%{opacity:.8}to{transform:translate3d(-30px,calc(var(--vh) * -100 - 80px),0) scale(.6);opacity:0}}
#fx .tw{position:absolute;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
#fx .fw{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;animation:burst 4.2s ease-out infinite;opacity:0}
@keyframes burst{0%{transform:scale(.1);opacity:0}8%{opacity:.75}60%{opacity:.45}100%{transform:scale(1.4);opacity:0}}
#garland{position:fixed;left:var(--rail);right:0;top:0;height:34px;z-index:2;pointer-events:none}
#garland svg{width:100%;height:34px}
.blink{animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
body.noanim .blink{animation:none}

/* ---------- Ram ---------- */
#rail{position:fixed;z-index:20;left:0;top:0;bottom:0;width:var(--rail);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 8px 10px;background:rgba(4,10,16,.72);border-right:1px solid var(--line)}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;color:var(--ink2);min-height:52px;margin:2px 0;transition:background .25s,color .25s}
.tab svg{width:30px;height:30px}
.tab span{font-size:13px;font-weight:600;margin-top:4px;letter-spacing:.2px}
.tab.on{background:var(--accent);color:var(--accentInk)}
#main{position:fixed;z-index:5;left:var(--rail);top:0;right:0;height:calc(var(--vh) * 100);padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 16px}
.view{display:none;height:100%;min-height:0}
.view.on{display:flex;flex-direction:column;animation:viewIn .35s ease-out}
@keyframes viewIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}

/* ---------- Kort ---------- */
.card{position:relative;border-radius:var(--r);background:linear-gradient(180deg,rgba(var(--card),.96),rgba(var(--card),.93));
  border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.07);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
body.glass .card{background:linear-gradient(180deg,rgba(var(--card),.62),rgba(var(--card),.55));-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.ch{display:flex;align-items:center;padding:14px 16px 10px 18px;flex:0 0 auto}
.ch h3{margin:0;font-size:21px;font-weight:700;letter-spacing:.2px;flex:1 1 auto;display:flex;align-items:center;min-width:0}
.ch h3 svg{width:22px;height:22px;margin-right:9px;color:var(--accent);flex:0 0 auto}
.ch h3 .cnt{font-size:15px;font-weight:600;color:var(--ink3);margin-left:8px;white-space:nowrap}
.ch h3 .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cb{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 12px;min-height:0}
.more{font-size:15px;font-weight:600;color:var(--ink2);display:flex;align-items:center;min-height:44px;padding:0 6px 0 12px}
.more svg{width:18px;height:18px;margin-left:2px}
.ibtn{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accentInk);flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ibtn svg{width:26px;height:26px}
.ibtn.ghost{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.pbtn{min-height:48px;border-radius:15px;padding:0 18px;background:var(--accent);color:var(--accentInk);font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.pbtn svg{width:20px;height:20px;margin-right:7px}
.gbtn{min-height:48px;border-radius:15px;padding:0 16px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.gbtn svg{width:20px;height:20px;margin-right:7px}
.empty{color:var(--ink2);font-size:17px;font-style:italic;padding:14px 8px;line-height:1.4}
.vh{display:flex;align-items:flex-end;margin-bottom:14px;flex:0 0 auto}
.vh h1{margin:0;font-size:40px;font-weight:300;letter-spacing:-.5px;line-height:1}
.vh .sub{font-size:17px;color:var(--ink2);margin-top:6px;font-style:italic}
.vh .tt{flex:1 1 auto;min-width:0}
.vh .act{display:flex;align-items:center}
.vh .act > * + *{margin-left:10px}

/* ---------- Listor ---------- */
.li{display:flex;align-items:center;min-height:56px;padding:4px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.new{animation:itemIn .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes itemIn{from{opacity:0;transform:translate3d(-14px,0,0) scale(.97)}to{opacity:1;transform:none}}
.ck{flex:0 0 48px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin-right:8px}
.ck i{width:32px;height:32px;border-radius:11px;border:2.5px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .2s}
.ck svg{width:22px;height:22px;color:var(--accentInk)}
.ck svg path{stroke-dasharray:24;stroke-dashoffset:24}
.done .ck i{background:var(--accent);border-color:var(--accent)}
.done .ck svg path{stroke-dashoffset:0}
.pop .ck i{animation:pop .42s cubic-bezier(.2,.9,.3,1.4)}
.pop .ck svg path{transition:stroke-dashoffset .35s ease-out .08s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.lt{flex:1 1 auto;min-width:0;text-align:left;font-size:20px;line-height:1.25;padding:8px 0;color:var(--ink);word-wrap:break-word}
.lt small{display:block;font-size:14px;color:var(--ink3);margin-top:2px}
.done .lt{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.45)}
.who{flex:0 0 auto;font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;margin-left:8px;color:#111;white-space:nowrap}
.who-me{background:#a9d8ff}.who-partner{background:#ffc6de}.who-both{background:#dccbff}
.ex{display:inline-block;white-space:nowrap;font-size:12px;font-weight:800;color:#111;background:#e9ecef;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;line-height:1.35;font-style:normal;text-decoration:none;letter-spacing:.3px}
.ev{display:flex;align-items:center;width:100%;text-align:left;border-radius:14px;padding:8px 12px;margin:5px 0;font-size:18px;color:var(--ink);min-height:48px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.ev .tm{font-weight:700;margin-right:10px;color:var(--accent);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ev .et{flex:1 1 auto;min-width:0;line-height:1.25}
.ev .rp{display:inline-block;font-size:13px;color:var(--ink3);margin-left:6px;white-space:nowrap}
.sec{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);margin:12px 6px 4px}

/* ---------- Hem ---------- */
#v-home{display:none}
#v-home.on{display:grid}
#v-home{grid-template-columns:repeat(12,1fr);grid-template-rows:226px 100px minmax(0,1fr);gap:14px;
  grid-template-areas:"clk clk clk clk clk wx wx wx wx wx wx wx" "nx nx nx nx nx nx nx ch ch ch ch ch" "td td td td mt mt mt mt sh sh sh sh"}
#hClock{grid-area:clk;display:flex;flex-direction:column;justify-content:flex-start;padding:4px 4px 0;text-shadow:0 0 3px rgba(0,0,0,.55),0 0 14px rgba(0,0,0,.55),0 2px 22px rgba(0,0,0,.5);min-width:0}
.vh{text-shadow:0 0 3px rgba(0,0,0,.5),0 0 14px rgba(0,0,0,.5)}
.bigtime{font-size:108px;font-weight:200;letter-spacing:-4px;line-height:.92;font-variant-numeric:tabular-nums}
.bigtime .sec2{font-size:.32em;font-weight:300;letter-spacing:0;color:var(--ink2);margin-left:6px}
.dateline{font-size:22px;font-weight:600;margin-top:8px}
.dateline span{color:var(--ink2);font-weight:500}
#greet{font-size:23px;font-weight:600;margin-top:10px;line-height:1.2}
#quip{font-size:17px;color:var(--ink2);font-style:italic;margin-top:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#hWx{grid-area:wx}
#hNext{grid-area:nx}
#hChips{grid-area:ch;padding:6px 10px;justify-content:center}
#hChips:empty{display:none}
.rem{display:flex;align-items:center;min-height:29px;width:100%;text-align:left;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden}
.rem i{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-right:9px;font-style:normal;font-size:14px;flex:0 0 auto;background:var(--accent);color:var(--accentInk)}
.rem i svg{width:15px;height:15px}
.rem span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.rem.po{display:none}
.rem b{font-variant-numeric:tabular-nums;color:var(--accent);margin-right:6px}
#hToday{grid-area:td}#hMeal{grid-area:mt}#hShop{grid-area:sh}
.nextc{flex-direction:row;align-items:center;padding:0 20px;text-align:left;background:linear-gradient(110deg,rgba(var(--card),.9),rgba(var(--card),.72))}
.nextc .ic{width:54px;height:54px;border-radius:17px;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-right:16px}
.nextc .ic svg{width:30px;height:30px}
.nextc .lbl{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3)}
.nextc .tx{font-size:23px;font-weight:600;line-height:1.2;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.nextc .tt{flex:1 1 auto;min-width:0}
.nextc .when{flex:0 0 auto;text-align:right;margin-left:12px}
.nextc .when b{display:block;font-size:30px;font-weight:300;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.05}
.nextc .when span{font-size:14px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;min-height:42px;border-radius:999px;padding:0 14px 0 8px;margin:3px 6px 3px 0;font-size:15px;font-weight:600;background:rgba(var(--card),.86);border:1px solid var(--line);color:var(--ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:8px;font-style:normal;font-size:16px;flex:0 0 auto;background:var(--accent);color:var(--accentInk)}
.chip i svg{width:18px;height:18px}
.chip b{font-weight:800;margin-right:4px}
.chip.hot{background:var(--accent);color:var(--accentInk);border-color:transparent}
.chip.hot i{background:rgba(0,0,0,.14);color:var(--accentInk)}
.dish{font-size:28px;font-weight:300;line-height:1.15;padding:2px 6px 6px}
.dishl{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);padding:0 6px}
.mini{display:flex;align-items:center;min-height:44px;border-top:1px solid var(--line);padding:4px 6px;font-size:17px}
.mini .d{flex:0 0 58px;color:var(--ink3);font-weight:700;font-size:15px}
.mini .d svg{width:22px;height:22px;color:var(--accent)}
.mini .t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Väder ---------- */
.wx{flex-direction:row;padding:14px 14px 12px 16px}
.wxnow{flex:0 0 205px;display:flex;flex-direction:column;min-width:0}
.wxtop{display:flex;align-items:center}
.wxtop svg{width:70px;height:70px;flex:0 0 auto}
.wxt{font-size:60px;font-weight:200;letter-spacing:-2px;line-height:1;margin-left:6px;font-variant-numeric:tabular-nums}
.wxd{font-size:17px;font-weight:600;margin-top:6px}
.wxs{font-size:15px;color:var(--ink2);margin-top:3px}
.wxs b{color:var(--ink)}
.wxplace{font-size:13px;color:var(--ink3);margin-top:auto;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxplace svg{width:14px;height:14px;margin-right:4px;flex:0 0 auto}
.wxr{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:12px;margin-left:8px}
.wxrow{display:flex;flex:1 1 0;min-height:0}
.wxrow + .wxrow{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.wxc{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.wxc .h{font-size:14px;color:var(--ink2);font-weight:600}
.wxc svg{width:34px;height:34px;margin:2px 0}
.wxc .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.wxc .v span{color:var(--ink3);font-weight:500}
.wxc .pp{font-size:12px;color:#9fd4ff;font-weight:700;height:14px}
.wxempty{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 8px}
.wxempty p{margin:0 0 12px;font-size:18px;color:var(--ink2);font-style:italic;line-height:1.35}
.offl{display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:#111;background:#ffd27a;border-radius:6px;padding:1px 6px;margin-left:6px}

/* ---------- Vecka ---------- */
.weekgrid{flex:1 1 auto;display:flex;min-height:0}
.wday{flex:1 1 0;min-width:0;margin-right:10px;display:flex;flex-direction:column}
.wday:last-child{margin-right:0}
.wday .wh{padding:12px 10px 8px;border-bottom:1px solid var(--line)}
.wday .wn{font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink2)}
.wday .wd{font-size:34px;font-weight:200;line-height:1.05;font-variant-numeric:tabular-nums}
.wday.today{background:linear-gradient(180deg,rgba(var(--card),.95),rgba(var(--card),.85));border-color:var(--accent)}
.wday.today .wn{color:var(--accent)}
.wday .cb{padding:6px 6px 6px}
.wday .ev{font-size:16px;padding:6px 8px;flex-wrap:wrap;min-height:44px}
.wday .ev .tm{font-size:14px;margin-right:6px}
.wmeal{font-size:14px;color:var(--ink2);padding:6px 4px;line-height:1.3;border-bottom:1px dashed var(--line);margin-bottom:4px;text-align:left;width:100%;min-height:36px}
.wadd{width:100%;min-height:44px;border-radius:12px;border:1px dashed rgba(255,255,255,.28);color:var(--ink2);display:flex;align-items:center;justify-content:center;margin-top:4px}
.wadd svg{width:20px;height:20px}
.datesStrip{flex:0 0 132px;margin-top:12px;flex-direction:row;align-items:stretch}
.datesStrip .ch{flex:0 0 190px;flex-direction:column;align-items:flex-start;justify-content:center;border-right:1px solid var(--line)}
.dlist{flex:1 1 auto;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px;align-items:stretch}
.dcard{flex:0 0 180px;margin-right:10px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.dcard .dn{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .dd{font-size:14px;color:var(--ink2);margin-top:3px}
.dcard .dc{font-size:14px;font-weight:800;color:var(--accent);margin-top:3px}

/* ---------- Mat ---------- */
.mrows{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.mrow{flex:1 1 0;display:flex;align-items:center;flex-direction:row;padding:0 12px 0 0;margin-bottom:8px;min-height:0}
.mrow:last-child{margin-bottom:0}
.mrow .md{flex:0 0 112px;padding-left:18px}
.mrow .md b{display:block;font-size:19px;font-weight:700}
.mrow .md span{font-size:14px;color:var(--ink3)}
.mrow.today{border-color:var(--accent)}
.mrow.today .md b{color:var(--accent)}
.mrow .mm{flex:1 1 auto;min-width:0;text-align:left;padding:6px 8px;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.mrow .mn{font-size:22px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mn.none{color:var(--ink3);font-style:italic;font-size:18px}
.mrow .mi{font-size:14px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Inköp ---------- */
.shopwrap{flex:1 1 auto;display:flex;min-height:0}
.shopmain{flex:1 1 auto;min-width:0;margin-right:14px}
.shopside{flex:0 0 300px;display:flex;flex-direction:column}
.cats{column-count:2;column-gap:14px}
.cat{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:4px 8px 4px}
.cat h4{display:flex;align-items:center;margin:8px 6px 2px;font-size:14px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2)}
.cat h4 i{width:12px;height:12px;border-radius:50%;margin-right:8px}
.cat .li{min-height:50px}
.cat .lt{font-size:19px}
.qadd{display:flex;padding:14px}
.qadd input{flex:1 1 auto;min-width:0;height:52px;border-radius:15px;border:2px solid transparent;background:#ffffff;color:#111;padding:0 14px;font-size:19px}
.qadd .ibtn{margin-left:8px;height:52px;width:52px}

function autoTheme(d){
  var y=d.getFullYear(),md=(d.getMonth()+1)*100+d.getDate();
  if(md>=1227||md<=102)return 'nyar';
  if(d>=forstaAdvent(y)&&md<=1226)return 'jul';
  if(md>=210&&md<=214)return 'hjartans';
  var e=easter(y); if(between(d,addDays(e,-7),addDays(e,1)))return 'pask';
  if(md>=427&&md<=501)return 'valborg';
  var ms=midsommarafton(y); if(between(d,addDays(ms,-6),addDays(ms,2)))return 'midsommar';
  if(md>=701&&md<=815)return 'sommar';
  if(md>=1025&&md<=1101)return 'halloween';
  if(md>=901)return 'host';
  if(md>=103&&md<=315)return 'vinter';
  return 'standard';
}

function occursOn(e,d){
  var a=parseYmd(e.date);if(!a)return false;var n=dayDiff(a,d);if(n<0)return false;
  switch(e.repeat||'none'){
    case 'none':return n===0;
    case 'weekly':return n%7===0;
    case 'biweekly':return n%14===0;
    case 'monthly':return a.getDate()===d.getDate();
    case 'yearly':return a.getDate()===d.getDate()&&a.getMonth()===d.getMonth();
  }return false;
}
function eventsOn(d){return S.events.filter(function(e){return occursOn(e,d);}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});}
function nextEvent(){
  var n=now();
  for(var i=0;i<8;i++){
    var d=addDays(n,i),ev=eventsOn(d),timed=null,allday=null;
    for(var j=0;j<ev.length;j++){var e=ev[j];
      if(e.time){var p=e.time.split(':'),at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1]);
        if(at.getTime()>n.getTime()-5*60000&&(!timed||at<timed.at))timed={e:e,at:at,day:d};}
      else if(!allday)allday={e:e,at:null,day:d,allday:true};
    }
    if(i===0&&timed)return timed;
    if(allday)return allday;
    if(timed)return timed;
  }
  return null;
}

function closeSaver(){$('saver').className='';lastTouch=Date.now();}
function checkIdle(){
  var m=+S.settings.saverMin;if(!m||F||$('alarm').className)return;
  if(Date.now()-lastTouch>m*60000)openSaver();
}

/* ================= Navigering ================= */
function go(v){
  if(v===cur&&v!=='home'){renderView();return;}
  cur=v;[].forEach.call(document.querySelectorAll('.view'),function(el){el.classList.toggle('on',el.id==='v-'+v);});
  if(v==='vecka')weekOff=0;
  renderRail();renderView();renderPills();
  $('main').scrollTop=0;
}
function renderView(){
  switch(cur){case 'home':renderHome();break;case 'idag':renderIdag();break;case 'vecka':renderVecka();break;case 'mat':renderMat();break;
    case 'inkop':renderInkop();break;case 'sysslor':renderSysslor();break;case 'timer':renderTimer();break;case 'inst':renderInst();break;}
}
function renderAll(){renderView();if(cur!=='home')renderHome();renderPills();popId=null;newId=null;}

/* ================= Klick ================= */
document.addEventListener('touchstart',function(){lastTouch=Date.now();unlockAudio();},{passive:true});
document.addEventListener('mousedown',function(){lastTouch=Date.now();unlockAudio();});
document.addEventListener('keydown',function(){lastTouch=Date.now();});
$('saver').addEventListener('click',function(ev){ev.stopPropagation();closeSaver();});
$('editor').addEventListener('click',function(ev){if(ev.target===this)closeForm();});
document.addEventListener('click',function(ev){
  lastTouch=Date.now();unlockAudio();
  var el=ev.target;
  while(el&&el!==document&&!(el.getAttribute&&(el.getAttribute('data-act')||el.getAttribute('data-seg'))))el=el.parentNode;
  if(!el||el===document)return;
  var seg=el.getAttribute('data-seg');
  if(seg&&F){F.vals[seg]=el.getAttribute('data-v');[].forEach.call(el.parentNode.children,function(b){b.classList.toggle('on',b===el);});return;}
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),kind=el.getAttribute('data-kind'),it,i;
  switch(a){
    case 'go':go(el.getAttribute('data-v'));break;
    case 'tick':
      if(kind==='chores'){it=byId(S.chores,id);if(it){it.doneWeek=choreDone(it)?-1:weekIndex(now());if(choreDone(it))popId=id;}}
      else{it=byId(S[kind],id);if(it){it.done=!it.done;if(it.done)popId=id;}}
      save();renderAll();break;
    case 'edit':editDate=null;editItem(kind,id);break;
    case 'add':editDate=el.getAttribute('data-date');editItem(kind,null);break;
    case 'clearDone':var before=S[kind].length;S[kind]=S[kind].filter(function(x){return !x.done;});save();renderAll();toast((before-S[kind].length)+' borttagna. Rent och prydligt.');break;
    case 'goShopAdd':go('inkop');setTimeout(function(){var i2=$('shopInput');if(i2)i2.focus();},80);break;
    case 'fav':var f=S.favs[+el.getAttribute('data-i')];if(f){var n=addShop([f]);renderAll();toast(n?f+' tillagd.':f+' står redan på listan.');}break;
    case 'editFavs':openForm({title:'Favoriter',values:{favs:S.favs.join(', ')},fields:[{k:'favs',l:'Varor som ofta behövs (separera med komma)',t:'area'}],
      onSave:function(v){S.favs=v.favs.split(/\s*[,\n]\s*/).map(function(x){return x.trim();}).filter(Boolean);}});break;
    case 'editMenu':editMenu(el.getAttribute('data-d'));break;
    case 'menuToShop':menuToShop([+el.getAttribute('data-d')]);break;
    case 'menuAllToShop':menuToShop([1,2,3,4,5,6,7]);break;
    case 'menuClear':if(confirm('Tömma hela veckomenyn?')){for(i=1;i<=7;i++)S.menu[i]={dish:'',ingr:[]};save();renderAll();toast('Veckomenyn är tom. Ett oskrivet blad.');}break;
    case 'week':var o=+el.getAttribute('data-o');weekOff=o===0?0:weekOff+o;renderVecka();break;
    case 'fSave':formSave();break;case 'fCancel':closeForm();break;case 'fDel':if(F&&F.onDelete)F.onDelete();break;
    case 'tsug':$('tName').value=el.getAttribute('data-n');break;
    case 'tstart':startTimer(+el.getAttribute('data-m'),($('tName').value||'').trim());break;
    case 'tstartc':var mm=parseFloat(($('tMin').value||'').replace(',','.'));if(mm>0)startTimer(mm,($('tName').value||'').trim());else toast('Ange antal minuter.');break;
    case 'tpause':it=byId(S.timers,id);if(it){it.left=it.end-Date.now();it.state='pause';save();renderAll();}break;
    case 'tresume':it=byId(S.timers,id);if(it){it.end=Date.now()+it.left;it.state='run';save();renderAll();}break;
    case 'tplus':it=byId(S.timers,id);if(it){if(it.state==='run')it.end+=60000;else it.left+=60000;it.dur+=60000;save();tickTimers();}break;
    case 'tstop':i=findIn(S.timers,id);if(i>=0){S.timers.splice(i,1);save();if(!S.timers.some(function(t){return t.state==='ring';})&&alarmT)stopAlarm();renderAll();}break;
    case 'alarmOff':stopAlarm();break;
    case 'tog':var k=el.getAttribute('data-k');S.settings[k]=!S.settings[k];save();
      if(k==='semester'||k==='anim')applyTheme(true);if(k==='glass')document.body.classList.toggle('glass',!!S.settings.glass);
      renderInst();renderHome();if(k==='night')applyNight();break;
    case 'citySearch':citySearch();break;
    case 'pickCity':var r=geoRes[+el.getAttribute('data-i')];if(r){S.settings.city={name:r.name,region:[r.admin1,r.country].filter(Boolean).join(', '),lat:r.latitude,lon:r.longitude};geoRes=[];save();renderInst();toast('Väder för '+r.name+'. Jag hämtar prognosen.');refreshWx(true);}break;
    case 'wxRefresh':refreshWx(true);toast('Hämtar färskt väder…');break;
    case 'testSound':unlockAudio();beep();toast(S.settings.sound?'Pip! Hörs inget? Kolla ljudet och tystläget på plattan.':'Ljudet är avstängt i inställningarna.');break;
    case 'saverNow':setTimeout(openSaver,50);break;
    case 'export':doExport();break;
    case 'showJson':var b=$('exportBox');b.style.display='block';b.value=JSON.stringify(S,null,1);toast('Markera allt och kopiera, t.ex. till Anteckningar.');break;
    case 'importFile':$('importInput').click();break;
    case 'importText':var bx=$('exportBox');if(bx.style.display!=='block'||!bx.value.trim()){bx.style.display='block';bx.value='';bx.focus();toast('Klistra in säkerhetskopian och tryck Importera text igen.');}else importData(bx.value);break;
    case 'removeExamples':['todos','events','shop','notes','chores','pickups','dates'].forEach(function(k){S[k]=S[k].filter(function(x){return !x.ex;});});
      for(i=1;i<=7;i++)if(S.menu[i]&&S.menu[i].ex)S.menu[i]={dish:'',ingr:[]};save();renderAll();toast('Exemplen är borta. Nu är det på riktigt.');break;
    case 'wipe':if(confirm('Tömma alla listor, händelser, sysslor, datum och lappar? Inställningarna behålls.')){['todos','events','shop','notes','chores','pickups','dates','timers'].forEach(function(k){S[k]=[];});for(i=1;i<=7;i++)S.menu[i]={dish:'',ingr:[]};save();renderAll();toast('Allt är tömt. Rent och prydligt.');}break;
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target,k=el.getAttribute&&el.getAttribute('data-set');if(!k)return;
  var v=el.value;if(k==='saverMin')v=+v;
  if(k.indexOf('cd.')===0)S.settings.cd[k.slice(3)]=v;else S.settings[k]=(k==='me'||k==='partner')?(v.trim()||(k==='me'?'Patrik':'Sambo')):v;
  save();if(k==='theme')applyTheme(true);renderHome();
  if(k==='theme'||k.indexOf('cd.')===0)renderInst();
});
document.addEventListener('keydown',function(ev){if(ev.target&&ev.target.id==='cityQ'&&ev.key==='Enter'){ev.preventDefault();citySearch();}});
function citySearch(){
  var q=($('cityQ').value||'').trim();if(!q){toast('Skriv en ort först.');return;}
  fetchJson('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=6&language=sv&format=json',10000)
   .then(function(j){geoRes=(j&&j.results)||[];renderInst();var cq=$('cityQ');if(cq)cq.value=q;if(!geoRes.length)toast('Hittade ingen ort som heter så. Stavning?');})
   .catch(function(){toast('Kunde inte söka – är plattan uppkopplad?');});
}
$('importInput').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){importData(String(r.result));};r.readAsText(f);this.value='';});
function doExport(){
  var name='jarvis-hemskarm-'+ymd(now())+'.json';
  try{var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);toast('Säkerhetskopia skapad: '+name);}
  catch(e){toast('Nedladdning gick inte – använd Visa som text.');}
}
function importData(txt){
  var o;try{o=JSON.parse(txt);}catch(e){toast('Det där var inte en giltig säkerhetskopia.');return;}
  if(!o||!o.settings||!o.todos){toast('Filen saknar hemskärmsdata.');return;}
  if(!confirm('Ersätta allt på skärmen med säkerhetskopian?'))return;
  S=normalize(o);save();applyTheme(true);renderAll();toast('Säkerhetskopian är inläst. Välkommen tillbaka.');
}

/* ================= Tick & dygn ================= */
var lastMin=-1,lastDay='';
function applyNight(){var h=now().getHours();document.body.classList.toggle('isnight',!!S.settings.night&&(h>=23||h<6));}
function dayRollover(){
  var today=ymd(now());if(S.lastDay===today)return;
  if(S.settings.autoClear)S.todos=S.todos.filter(function(t){return !t.done;});
  var cutoff=ymd(addDays(now(),-60));S.events=S.events.filter(function(e){return (e.repeat&&e.repeat!=='none')||e.date>=cutoff;});
  S.lastDay=today;save();
}
function tick(){
  var d=now();
  if(cur==='home'&&S.settings.secs)renderClock();
  tickTimers();checkIdle();
  if(d.getMinutes()!==lastMin){
    lastMin=d.getMinutes();
    if(ymd(d)!==lastDay){lastDay=ymd(d);dayRollover();applyTheme();renderAll();}
    else if(cur==='home')renderHome();else renderClock();
    if($('saver').className==='open'){renderSaver();if(++saverDrift%2===0){var sv=$('saverIn');sv.style.marginLeft=Math.round(rnd(-60,60))+'px';sv.style.marginTop=Math.round(rnd(-40,40))+'px';}}
    applyNight();
  }
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){lastMin=-1;lastDay='';tick();refreshWx();fetchDagens();}});
window.addEventListener('resize',setVh);
window.addEventListener('orientationchange',function(){setTimeout(setVh,300);});

/* ================= Daglig Jarvis-fil (dagens.json) ================= */
function fetchDagens(){
  if(!window.fetch||location.protocol==='file:')return;
  fetch('dagens.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(!j)return;
    if(j.meddelande)S.dagens={date:j.datum||ymd(now()),text:String(j.meddelande)};
    if(j.handelser&&j.handelser.length)j.handelser.forEach(function(e){var id='j-'+(e.id||(e.datum+'-'+e.text));if(findIn(S.events,id)<0)S.events.push({id:id,date:e.datum,time:e.tid||'',text:e.text,who:e.vem||'',repeat:'none'});});
    if(j.inkop&&j.inkop.length)addShop(j.inkop);
    save();renderAll();
  }).catch(function(){});
}

/* ================= Start ================= */
setVh();load();loadWx();
if(params.wx==='offline')wxOnline=false;
document.body.classList.toggle('glass',!!S.settings.glass);
applyTheme(true);renderRail();
go(params.vy&&document.getElementById('v-'+params.vy)?params.vy:'home');
lastDay=ymd(now());dayRollover();lastMin=now().getMinutes();applyNight();
setInterval(tick,1000);
if(params.wx!=='offline')refreshWx();else renderWxAll();
setInterval(function(){refreshWx();},30*60000);
fetchDagens();setInterval(fetchDagens,60*60000);
S.timers.forEach(function(t){if(t.state==='ring')t.state='run';});
if(params.saver)setTimeout(openSaver,30);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
window.__hem={S:function(){return S;},go:go,applyTheme:applyTheme,renderAll:renderAll,openSaver:openSaver,closeSaver:closeSaver,editItem:editItem,closeForm:closeForm,startAlarm:startAlarm,stopAlarm:stopAlarm,tickTimers:tickTimers,menuToShop:menuToShop,startTimer:startTimer,tick:tick,guessCat:guessCat,choreWho:choreWho,weekIndex:weekIndex,save:save};
})();
</script>
</body>
